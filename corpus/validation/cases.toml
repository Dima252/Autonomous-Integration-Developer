# Seeded bugs for the validator (ADR 019). Each case is base/ plus small edits, and
# `expect` lists exactly the checks that must fail. The rest must pass or be skipped.
# Run them: uv run python -m aidev.validation eval   (from backend/; needs Docker)

[[case]]
name = "good"
description = "The reference solution: every check passes"
expect = []

[[case]]
name = "invented-package"
description = "A dependency that doesn't exist on PyPI"
expect = ["install"]
edits = [
  { path = "requirements.txt", append = "stripe-billing-webhooks-helper==2.1.0\n" },
]

[[case]]
name = "unpinnable-version"
description = "A release of a real package that was never published"
expect = ["install"]
edits = [
  { path = "requirements.txt", old = "stripe==16.1.0", new = "stripe==99.0.0" },
]

[[case]]
name = "index-override"
description = "requirements.txt tries to install from another package index"
expect = ["install"]
edits = [
  { path = "requirements.txt", append = "--extra-index-url https://pypi.example.com/simple\n" },
]

[[case]]
name = "missing-dependency"
description = "The code imports stripe but requirements.txt doesn't list it"
expect = ["pyright"]
edits = [
  { path = "requirements.txt", old = "stripe==16.1.0\n", new = "" },
]

[[case]]
name = "invented-sdk-method"
description = "An SDK method that stripe-python doesn't have"
expect = ["pyright"]
edits = [
  { path = "app/main.py", old = "stripe.Webhook.construct_event(", new = "stripe.Webhook.verify_and_parse(" },
]

[[case]]
name = "stripe-object-as-dict"
description = "Reads a Stripe object like a dict, which stripe-python 15+ rejects at run time"
expect = ["pyright"]
edits = [
  { path = "app/main.py", old = "invoice = event.data.object.to_dict()", new = "invoice = event.data.object" },
]

[[case]]
name = "unused-result"
description = "The alert computes the amount, then never uses it"
expect = ["ruff"]
edits = [
  { path = "app/slack.py", old = "({amount:.2f} {currency})", new = "({currency})" },
]

[[case]]
name = "undefined-name"
description = "A typo in a variable name: both linters see it"
expect = ["ruff", "pyright"]
edits = [
  { path = "app/main.py", old = "seen_events.add(event.id)", new = "seen_event.add(event.id)" },
]

# --- grounding: claims about the API that only the catalog can refute ---------------

[[case]]
name = "invented-endpoint"
description = "A Slack Web API method that doesn't exist"
expect = ["grounding"]
edits = [
  { path = "app/slack.py", old = "chat.postMessage", new = "chat.sendAlert" },
]

[[case]]
name = "unknown-event"
description = "A misspelled Stripe event type: the handler would never fire"
expect = ["grounding"]
edits = [
  { path = "app/main.py", old = '"invoice.payment_failed"', new = '"invoice.payment_faild"' },
]

# --- pytest: behavior, against mocks built from the providers' specs ----------------

[[case]]
name = "reserialized-body"
description = "Verifies the signature over re-serialized JSON instead of the raw bytes"
expect = ["pytest"]
edits = [
  { path = "app/main.py", old = "import os\n", new = "import json\nimport os\n" },
  { path = "app/main.py", old = "payload = await request.body()", new = "payload = json.dumps(await request.json()).encode()" },
]

[[case]]
name = "no-deduplication"
description = "Handles every delivery, so Stripe's retries alert twice"
expect = ["pytest"]
edits = [
  { path = "app/main.py", old = " and event.id not in seen_events:", new = ":" },
]

[[case]]
name = "vip-flag-as-bool"
description = "Compares Stripe metadata to True, but metadata values are strings"
expect = ["pytest"]
edits = [
  { path = "app/main.py", old = 'metadata.get("vip") == "true"', new = 'metadata.get("vip") is True' },
]

[[case]]
name = "slack-missing-channel"
description = "Calls chat.postMessage without the channel its spec requires"
expect = ["pytest"]
edits = [
  { path = "app/slack.py", old = "            \"channel\": CHANNEL,\n", new = "" },
]
