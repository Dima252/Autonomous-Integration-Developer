# Labeled example messages for the router's tier 0 nearest-neighbour stage
# (backend/src/aidev/router/nearest.py, ADR 012).
#
# Tier 0 only ever answers "chitchat". The other intents are here as counterweights: a
# message is small talk only when its nearest chit-chat example is clearly closer than
# its nearest example of any other intent. The thresholds are tuned by leave-one-out
# over this file (`python -m aidev.router tune`). The golden set in
# corpus/eval/router.toml must not share any message with it.

# --- chitchat: small talk the rules don't cover -------------------------------------
