# Retrieval golden set. Each case is an information need as the Researcher agent would
# phrase it, with the documents that answer it. A case passes Hit@k when any relevant
# document is in the top k; Recall@k counts how many of them are.
#
# `providers` mirrors how agents search: scoped to the provider they're researching.
# Cases without it search the whole index (cross-provider engineering questions).
# Run: uv run python -m aidev.rag eval

# --- Stripe -----------------------------------------------------------------------

[[case]]
query = "How do I verify that a webhook request really came from Stripe?"
providers = ["stripe"]
relevant = ["stripe/guide/webhooks", "stripe/guide/webhook-signature-errors", "stripe/guide/webhooks-quickstart"]

[[case]]
query = "Which event fires when a subscription invoice payment fails?"
providers = ["stripe"]
relevant = ["stripe/webhook_event/invoice.payment_failed", "stripe/guide/subscription-webhooks"]

[[case]]
query = "event when a customer cancels their subscription"
providers = ["stripe"]
relevant = ["stripe/webhook_event/customer.subscription.deleted", "stripe/guide/subscription-webhooks"]

[[case]]
query = "get notified when an invoice is paid successfully"
providers = ["stripe"]
relevant = ["stripe/webhook_event/invoice.paid"]

[[case]]
query = "Create a new customer with an email address"
providers = ["stripe"]
relevant = ["stripe/operation/PostCustomers"]

[[case]]
query = "Find a customer by their email"
providers = ["stripe"]
relevant = ["stripe/operation/GetCustomersSearch"]

[[case]]
query = "Issue a refund for a charge"
providers = ["stripe"]
relevant = ["stripe/operation/PostRefunds"]

[[case]]
query = "Store custom key-value data such as a VIP flag on a customer"
providers = ["stripe"]
relevant = ["stripe/guide/metadata", "stripe/operation/PostCustomersCustomer"]

[[case]]
query = "Safely retry a POST request without creating duplicate objects"
providers = ["stripe"]
relevant = ["stripe/guide/idempotent-requests"]

[[case]]
query = "list all objects page by page using starting_after"
providers = ["stripe"]
relevant = ["stripe/guide/pagination"]

[[case]]
query = "What happens when I send too many requests and get a 429?"
providers = ["stripe"]
relevant = ["stripe/guide/rate-limits"]

[[case]]
query = "How long does Stripe keep retrying a webhook delivery that failed?"
providers = ["stripe"]
relevant = ["stripe/guide/webhooks"]

[[case]]
query = "Return related objects inline instead of just their IDs"
providers = ["stripe"]
relevant = ["stripe/guide/expanding-objects"]

[[case]]
query = "Pin the API version my requests use"
providers = ["stripe"]
relevant = ["stripe/guide/versioning"]

[[case]]
query = "A customer disputed a payment with their bank"
providers = ["stripe"]
relevant = ["stripe/webhook_event/charge.dispute.created"]

[[case]]
query = "Checkout finished and the customer paid"
providers = ["stripe"]
relevant = ["stripe/webhook_event/checkout.session.completed"]

