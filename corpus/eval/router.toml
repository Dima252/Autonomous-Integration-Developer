# Golden set for the router (python -m aidev.router eval, ADR 012).
#
# Each case is a user message with its correct route. `systems` lists the providers the
# message involves ("other" for any other service) and is scored on non-chitchat cases.
# `history` (oldest first) and `active_run` give the conversation state when the right
# answer depends on it.
#
# Held out: no message here may appear in corpus/router/examples.toml, which tier 0
# matches against and tunes on. The eval checks this before running.
#
# Labels for `clarify` are a judgment call ("too vague to start"); they're reported as
# their own row so disagreements are visible rather than averaged away.

