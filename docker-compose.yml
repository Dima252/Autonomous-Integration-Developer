# Backing services for local development. The Python backend runs natively
# (uv) so local embedding models can use the GPU without Docker passthrough.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: aidev
      POSTGRES_PASSWORD: aidev
      POSTGRES_DB: aidev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidev -d aidev"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
